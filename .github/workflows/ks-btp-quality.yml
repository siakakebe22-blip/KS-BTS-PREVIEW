name: KS BTP — contrôles qualité
on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/ks-btp-quality.yml"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/ks-btp-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check demo/sw.js
          node --check demo/offline-storage.js
          node --input-type=module --check < demo/offline-bootstrap.js
          node --input-type=module --check < demo/app.js
      - name: Vérifier les ressources hors connexion
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('demo/index.html', 'utf8');
          const sw = fs.readFileSync('demo/sw.js', 'utf8');
          const app = fs.readFileSync('demo/app.js', 'utf8');
          const bootstrap = fs.readFileSync('demo/offline-bootstrap.js', 'utf8');
          if (!app.includes('document.readyState==="complete"') || !app.includes('registerOfflineSupport()')) {
            throw new Error('Enregistrement du service worker non protégé contre un événement load déjà passé.');
          }
          if (!sw.includes('ks-btp-demo-offline-v20') || !sw.includes('new URL("./index.html",self.registration.scope).href')) {
            throw new Error('Repli de navigation hors connexion absent ou version de cache incorrecte.');
          }
          if (!bootstrap.includes('await import("./app.js")')) {
            throw new Error('Démarrage de l’application après initialisation du stockage absent.');
          }
          if (!bootstrap.includes('function validData(value)') || !bootstrap.includes('recordCount(snapshot)>recordCount(localData)')) {
            throw new Error('Protection contre l’écrasement par une base vide absente.');
          }
          if (!app.includes('function stockAudit()') || !app.includes('Contrôle de cohérence du stock') || !app.includes('Aucun ajustement automatique')) {
            throw new Error('Contrôle de cohérence du stock en lecture seule absent.');
          }
          if (!html.includes('id="movementForm"') || !app.includes('function submitMovement(e)') || !app.includes('$("#movementMaterial")') || !app.includes('$("#movementSite")')) {
            throw new Error('Formulaire de mouvement guidé ou validation absente.');
          }
          if (!html.includes('id="voucherStockAvailable"') || !app.includes('Stock disponible sur ') || !app.includes('$("#voucherStockAvailable").textContent')) {
            throw new Error('Affichage dynamique du stock disponible dans le bon absent.');
          }
          if (!app.includes('home-voucher-dock') || !app.includes('data-type="Sortie"') || !app.includes('data-type="Réception"') || !app.includes('data-type="Retour"') || !css.includes('.home-voucher-dock{position:fixed') || !css.includes('prefers-reduced-motion:reduce')) { throw new Error('Actions flottantes des bons absentes.'); }
          if (!app.includes('function printGeneralReport()') || !app.includes('data-action="print-general-report"') || !app.includes('RAPPORT GÉNÉRAL DE GESTION') || !app.includes('SITUATION DES CHANTIERS') || !app.includes('BONS DE STOCK') || !app.includes('JOURNAL DES ACTIVITÉS')) {
            throw new Error('Téléchargement du rapport général PDF ou ses rubriques essentielles absent.');
          }
          if (!html.includes('data-page="activity"') || !app.includes('function logAction(') || !app.includes('function activityPage(') || !app.includes('function printActivityLog(') || !app.includes('Enregistrer en PDF') || !app.includes('activityLog:[]')) {
            throw new Error('Journal automatique ou impression PDF absente.');
          }
          if (!app.includes('const auditCopy={...m,stockBalances:rawBalances.map(b=>({...b}))}')) {
            throw new Error('Audit du stock non destructif absent.');
          }
          if (!app.includes('const locationRows=[]') || !app.includes('Répartition réelle par emplacement')) {
            throw new Error('Détail des stocks par emplacement absent du contrôle.');
          }
          if (!app.includes('duplicateRefs') || !app.includes('orphanMovements') || !app.includes('invalidBalances')) {
            throw new Error('Détection des anomalies de stock et d’historique incomplète.');
          }
          if (!html.includes('ESPACE DE TRAVAIL') || !html.includes('PARC ET CHANTIERS') || !html.includes('STOCK ET OPÉRATIONS') || !html.includes('SUIVI ET CONTRÔLE') || !html.includes('ADMINISTRATION')) {
            throw new Error('Menu principal non organisé en rubriques.');
          }
          if (!app.includes('Matériels présents') || !app.includes('grouped=new Map()') || !app.includes('site-overview')) {
            throw new Error('Contenu synthétique et regroupement des matériels absents.');
          }
          if (!app.includes('function sitesPage(el)') || !app.includes('Matériels présents') || !app.includes('site-overview') || !app.includes('siteStatusFilter') || !app.includes('siteSearch') || !app.includes('grouped=new Map()')) {
            throw new Error('Page chantiers structurée, regroupement des matériels ou filtres absents.');
          }
          if (!app.includes('function siteMaterialFlow(site,material)') || !app.includes('consumed=sum(consumedDocs)') || !app.includes('received=sum(receivedDocs)') || !app.includes('returned=sum(returnedDocs)') || !app.includes('Consommé :')) {
            throw new Error('Suivi chantier réceptionné-consommé-retourné-disponible absent.');
          }
          if (!app.includes('const consumedDocs=docs.filter(d=>d.type==="Sortie")') || !app.includes('Document "+ref')) {
            throw new Error('Les bons de sortie doivent être des consommations sans double comptage des mouvements liés.');
          }
          if (!app.includes('function stockByUnit()') || !app.includes('Stock disponible par unité') || !app.includes('totalByUnit') || !app.includes('m.threshold??db.threshold')) {
            throw new Error('Synthèse des stocks par unité ou seuil zéro non géré.');
          }
          if (!app.includes('function applyStockChanges(item,changes)') || !app.includes('balances.some(x=>!Number.isFinite(Number(x.quantity))||Number(x.quantity)<0)') || !app.includes('Math.abs(aggregate-balanceTotal)>0.0001')) {
            throw new Error('Une écriture pourrait écraser une quantité invalide ou une ventilation incohérente.');
          }
          if (!app.includes('balance.locationId') || !app.includes('Emplacement non identifié') || !app.includes('locationName:resolved?resolved.name')) {
            throw new Error('Les emplacements inconnus ou quantités historiques ne sont pas préservés.');
          }
          if (!app.includes('if(storageLoadError)') || !app.includes('Aucune écriture ne sera autorisée')) {
            throw new Error('Protection contre l’écrasement de données locales illisibles absente.');
          }
          if (!app.includes('logAction("Suppression","Chantier"') || !app.includes('logAction("Suppression","Matériel"') || !app.includes('logAction("Suppression","Maintenance"')) {
            throw new Error('Traçabilité des suppressions absente.');
          }
          const storage = fs.readFileSync('demo/offline-storage.js', 'utf8');
          if (!storage.includes('const DB_VERSION=2') || !storage.includes('const DB_NAME="ks_btp_safe_store"') || !storage.includes('const HISTORY_LIMIT=10') || !storage.includes('readHistory') || !storage.includes('const LEGACY_DB_NAME="ks_btp_demo_offline"')) {
            throw new Error('Historique des sauvegardes locales absent.');
          }
          const required = ['index.html', 'style.css', 'app.js', 'offline-storage.js', 'offline-bootstrap.js', 'manifest.webmanifest', 'icon.svg'];
          for (const file of required) {
            if (!fs.existsSync('demo/' + file)) throw new Error('Ressource absente : ' + file);
            if (!sw.includes('./' + file)) throw new Error('Ressource non précachée : ' + file);
          }
          for (const file of ['style.css', 'manifest.webmanifest']) {
            if (!html.includes(file)) throw new Error('Ressource non référencée dans index.html : ' + file);
          }
          JSON.parse(fs.readFileSync('demo/manifest.webmanifest', 'utf8'));
          if (!html.includes('offline-storage.js') || !html.includes('offline-bootstrap.js')) {
            throw new Error('Initialisation du stockage hors connexion absente.');
          }
          // Tests arithmétiques sur les fonctions réellement utilisées par l'application.
          const functionSource = name => {
            const start = app.indexOf('function ' + name + '(');
            if (start < 0) throw new Error('Fonction de calcul absente : ' + name);
            let end = app.indexOf('\nfunction ', start + 10);
            if (end < 0) end = app.length;
            return app.slice(start, end);
          };
          const engineSource = ['stockLocation','ensureStockBalances','stockAt','changeStock','applyStockChanges','stockByUnit','totalStock']
            .map(functionSource).join('\n');
          const createEngine = new Function('db','id',engineSource + '\nreturn {stockAt,changeStock,applyStockChanges,stockByUnit,totalStock};');
          const testDb = {sites:[{id:'koloma-id',name:'Koloma'}],materials:[]};
          const engine = createEngine(testDb,()=> 'TEST-ID');
          const cement = {id:'cement',name:'Ciment test',unit:'Sacs',quantity:77,location:'Koloma'};
          testDb.materials.push(cement);
          const opening = engine.stockAt(cement,'koloma-id');
          for (const amount of [100,60,-23,-20]) {
            if (!engine.changeStock(cement,'koloma-id',amount)) throw new Error('Opération de stock refusée à tort : ' + amount);
          }
          if (opening !== 77 || engine.stockAt(cement,'koloma-id') !== 194 || cement.quantity !== 194) {
            throw new Error('Échec du calcul ouverture + réceptions - sorties = 194 sacs.');
          }
          const atomic = {id:'atomic',name:'Test atomique',unit:'Sacs',quantity:10,stockBalances:[{locationId:'central',locationName:'Magasin central',quantity:10}]};
          const atomicBefore = JSON.stringify(atomic);
          if (engine.applyStockChanges(atomic,[['central',-5],['koloma-id',Number.NaN]]) !== false || JSON.stringify(atomic) !== atomicBefore) throw new Error('Une opération multi-emplacements échouée doit annuler tous ses changements.');
          const transfer = {id:'transfer',name:'Peinture',unit:'Litre',quantity:50,stockBalances:[{locationId:'central',locationName:'Magasin central',quantity:50}]};
          if (!engine.changeStock(transfer,'central',-20) || !engine.changeStock(transfer,'koloma-id',20)) throw new Error('Transfert central vers chantier refusé.');
          if (engine.stockAt(transfer,'central') !== 30 || engine.stockAt(transfer,'koloma-id') !== 20 || transfer.quantity !== 50) throw new Error('Le transfert doit conserver le stock total.');
          if (!engine.changeStock(transfer,'koloma-id',-5) || !engine.changeStock(transfer,'central',5)) throw new Error('Retour chantier vers magasin refusé.');
          if (engine.stockAt(transfer,'central') !== 35 || engine.stockAt(transfer,'koloma-id') !== 15 || transfer.quantity !== 50) throw new Error('Le retour doit conserver le stock total.');
          const damaged = {id:'damaged',name:'Donnée invalide',unit:'Sacs',quantity:-3,stockBalances:[{locationId:'koloma-id',locationName:'Koloma',quantity:-3}]};
          const beforeDamaged = JSON.stringify(damaged);
          if (engine.changeStock(damaged,'koloma-id',5) !== false || JSON.stringify(damaged) !== beforeDamaged) throw new Error('Une quantité invalide doit être préservée et bloquer les écritures.');
          const orphan = {id:'orphan',name:'Ancien chantier',unit:'Sacs',quantity:5,stockBalances:[{locationId:'deleted-site-id',locationName:'Ancien chantier',quantity:5}]};
          engine.stockAt(orphan,'__unallocated__');
          if (orphan.stockBalances[0].locationId !== 'deleted-site-id') throw new Error('Un ancien identifiant de chantier ne doit pas être réaffecté automatiquement.');
          const mismatch = {id:'mismatch',name:'Écart',unit:'Sacs',quantity:9,stockBalances:[{locationId:'koloma-id',locationName:'Koloma',quantity:8}]};
          if (engine.changeStock(mismatch,'koloma-id',1) !== false || mismatch.quantity !== 9) throw new Error('Une ventilation incohérente doit bloquer les écritures.');
          const drill = {id:'drill',name:'Perceuse',unit:'pièce',quantity:7,location:'Koloma'};
          testDb.materials.push(drill);
          const totals = engine.stockByUnit();
          if (totals.Sacs !== 194 || totals['pièce'] !== 7) throw new Error('Les unités de stock doivent rester séparées.');
          const flowSource=functionSource('siteMaterialFlow');
          const flowDb={sites:[{id:'koloma-id',name:'Koloma'}],documents:[
            {ref:'BON-REC-1',type:'Réception',materialId:'flow-mat',site:'Koloma',quantity:100},
            {ref:'BON-SOR-1',type:'Sortie',materialId:'flow-mat',site:'Koloma',quantity:23},
            {ref:'BON-RET-1',type:'Retour',materialId:'flow-mat',site:'Koloma',quantity:5}
          ],movements:[
            {type:'réception',materialId:'flow-mat',location:'Koloma',quantity:100,note:'Document BON-REC-1'},
            {type:'sortie',materialId:'flow-mat',location:'Koloma',quantity:23,note:'Document BON-SOR-1'},
            {type:'retour',materialId:'flow-mat',location:'Koloma',quantity:5,note:'Document BON-RET-1'},
            {type:'sortie',materialId:'flow-mat',location:'Koloma',destination:'koloma-id',quantity:10,note:'Transfert manuel'},
            {type:'consommation',materialId:'flow-mat',location:'Koloma',source:'koloma-id',quantity:2,note:'Utilisation'}
          ]};
          const flowMaterial={id:'flow-mat',name:'Ciment',unit:'Sacs',quantity:157,stockBalances:[{locationId:'koloma-id',locationName:'Koloma',quantity:157}]};
          const siteMaterialFlowTest=new Function('db','stockAt',flowSource+';return siteMaterialFlow;')(flowDb,(m,site)=>m.stockBalances.filter(b=>b.locationId===site).reduce((n,b)=>n+b.quantity,0));
          const flow=siteMaterialFlowTest(flowDb.sites[0],flowMaterial);
          if(flow.received!==110||flow.consumed!==25||flow.returned!==5||flow.available!==157||flow.opening!==77) throw new Error('Échec du calcul du suivi chantier : les bons liés doivent être comptés une seule fois.');
          console.log('OK : tests arithmétiques, transferts, retours, unités, suivi chantier et protection des données.');
          console.log('OK : syntaxe, ressources locales, précache et manifeste.');
          NODE
